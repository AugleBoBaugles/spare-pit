name: CI

on:
    push:
        branches: [main, dev]

jobs:
    test-frontend:
        name: Frontend Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: client/package-lock.json

            - name: Install dependencies
              working-directory: client
              run: npm ci

            - name: Run tests
              working-directory: client
              run: npm test

    test-backend:
        name: Backend Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: server/package-lock.json

            - name: Install dependencies
              working-directory: server
              run: npm ci

            - name: Run tests
              working-directory: server
              run: npm test
